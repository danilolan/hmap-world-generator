<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>World Generator</title>
  <link rel="stylesheet" href="/ui/style.css">
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
</head>
<body>
  <header>
    <div class="brand">World Generator</div>
    <span class="muted" title="Stage 0: the world side is fixed">World 64 × 64 km</span>
    <label>Seed <input id="seed" type="number" value="1" min="0" step="1"></label>
    <button id="randomSeed" title="Random seed">Random</button>
    <button id="galleryBtn" title="Thumbnails of many seeds">Seed gallery</button>
    <label>Preview <select id="res"></select></label>
    <label title="Shrinks everything but the layout: ranges narrower (and lower), rivers thinner, bays smaller. The map then shows a larger world, compressed">World scale
      <select id="scale"></select></label>
    <label title="Heights shrink with the world scale (a range half as wide is half as high)"><input id="heightFollow" type="checkbox" checked> Heights follow</label>
    <span class="spacer"></span>
    <select id="presetList"><option value="">Presets…</option></select>
    <button id="presetLoad">Load</button>
    <button id="presetSave">Save as…</button>
    <button id="resetStage" title="Reset the selected stage's sliders">Reset stage</button>
  </header>
  <main>
    <aside id="stages"></aside>
    <section id="viewer">
      <div class="toolbar">
        <div id="viewTabs" class="tabs"></div>
        <span class="spacer"></span>
        <div class="tabs">
          <button id="detailBtn" title="High-resolution window: click a point on the map">Detail</button>
          <select id="detailSize" title="Detail window size">
            <option value="1">1 km</option><option value="2" selected>2 km</option>
            <option value="4">4 km</option><option value="8">8 km</option>
          </select>
        </div>
        <button id="tilesBtn" title="The exported 2 m tiles in 3D: click a point on the map">Tiles 3D</button>
        <div class="tabs">
          <button id="mode2d" class="active">2D</button>
          <button id="mode3d">3D</button>
        </div>
        <label id="exagLabel" class="hidden">Vertical × <input id="exag" type="range" min="1" max="8" step="0.5" value="3"></label>
      </div>
      <div id="canvasWrap">
        <img id="map" alt="">
        <div id="three" class="hidden"></div>
        <div id="busy" class="hidden">Computing…</div>
        <div id="legend" class="hidden"></div>
        <div id="exportPanel" class="hidden"></div>
        <div id="tilesPanel" class="hidden">
          <div class="toolbar">
            <strong>2 m tiles</strong>
            <select id="tilesSize" title="Window size"><option value="64">128 m</option><option value="128">256 m</option></select>
            <select id="tilesGrid" title="The grid the stages run on: the export's for the exact result">
              <option value="2048">2048² grid (as exported)</option><option value="1024">1024² grid</option>
              <option value="preview">Preview grid (approximate)</option></select>
            <select id="tilesColor"><option value="tiles">Tile materials</option><option value="soil">Soil depth</option>
              <option value="biome">Biome (16 m cells)</option></select>
            <label title="Sharp: one flat colour per 2 m tile. Blended: colours meet across tile edges"><input id="tilesBlend" type="checkbox"> Blend</label>
            <label><input id="tilesLines" type="checkbox"> Grid</label>
            <label><input id="tilesWater" type="checkbox"> Water</label>
            <label title="Markers of the 16 m ecology cells' tree density and species, not the game's own placement"><input id="tilesTrees" type="checkbox"> Trees</label>
            <label>Vertical × <input id="tilesExag" type="range" min="1" max="4" step="0.25"></label>
            <select id="tilesSubdiv" title="Surface samples per tile side (the game: 2 near the camera)">
              <option value="1">1 per tile</option><option value="2">2 per tile</option><option value="4">4 per tile</option></select>
            <span class="spacer"></span>
            <button id="tilesReload" title="Fetch again with the current sliders">Reload</button>
            <button id="tilesClose">Close</button>
          </div>
          <div id="tilesCanvas"><div id="tilesHover" class="hidden"></div><div id="tilesBusy" class="hidden"></div></div>
          <div class="status"><span id="tilesStats"></span><span class="spacer"></span><span id="tilesTiming"></span></div>
        </div>
      </div>
      <div class="status"><span id="stats"></span><span class="spacer"></span><span id="timing"></span></div>
    </section>
  </main>
  <div id="gallery" class="hidden">
    <div class="galleryBox">
      <div class="galleryHead">
        <strong>Seed gallery</strong> <span class="muted">— click a world to use its seed</span>
        <span class="spacer"></span>
        <button id="galleryMore">Other seeds</button>
        <button id="galleryClose">Close</button>
      </div>
      <div id="galleryGrid"></div>
    </div>
  </div>
  <script type="module" src="/ui/app.js"></script>
</body>
</html>
